name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify migrations apply to a clean database
        env:
          DATABASE_URL: sqlite:///./ci_migrate_check.db
        run: python -c "from app.database_migrations import ensure_schema; print(ensure_schema())"

      - name: Check migrations match the models
        env:
          DATABASE_URL: sqlite:///./ci_migrate_check.db
        run: |
          python - <<'PY'
          # A model change without a matching migration is a production outage
          # waiting to happen: create_all() hides it locally, Postgres does not.
          from alembic.autogenerate import compare_metadata
          from alembic.runtime.migration import MigrationContext
          from app.database import engine, Base
          from app import models  # noqa: F401

          with engine.connect() as conn:
              diff = compare_metadata(MigrationContext.configure(conn), Base.metadata)
          if diff:
              print("Schema drift between models and migrations:")
              for d in diff:
                  print("  ", d)
              raise SystemExit(1)
          print("No schema drift.")
          PY

      - name: Run tests
        run: pytest tests/ -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
